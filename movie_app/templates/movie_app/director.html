{%extends 'movie_app/base.html'%}

{%block title%}Режиссер{%endblock%}

{%block content%}
    <h1><i>Режиссер</i></h1>
    <ul>
        <li>Имя {{director.first_name}}</li>
        <li>Фамилия {{director.last_name}}</li>
        <li>Почта {{director.email}}</li>
    </ul>
    <hr>
    <h3>
        Сведения об фильмах
        <ul>
            {%for i in director.movie_set.all %}
            <li><a href="{%url 'movie-detail' slug_movie=i.slug%}">{{i}}</a></li>
            {%endfor%}
        </ul>
    </h3>
{%endblock%}
